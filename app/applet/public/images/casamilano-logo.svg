<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="60%" stop-color="#0a0d16" />
      <stop offset="95%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D1" />
      <stop offset="25%" stop-color="#DFBA67" />
      <stop offset="50%" stop-color="#FCE59F" />
      <stop offset="75%" stop-color="#B88A34" />
      <stop offset="100%" stop-color="#F7D88B" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C170" />
      <stop offset="50%" stop-color="#8C6621" />
      <stop offset="100%" stop-color="#DFBA67" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#6B4F12" />
    </linearGradient>

    <!-- Ball Shine Radial -->
    <radialGradient id="ballShine" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Black Marble Crest Plate -->
  <circle cx="400" cy="400" r="380" fill="url(#bgGrad)" stroke="#1a2030" stroke-width="2" />
  
  <!-- Subtle Internal Marble Texture Ring -->
  <circle cx="400" cy="400" r="372" fill="none" stroke="#251d10" stroke-width="1.5" stroke-dasharray="12 4 4 6" opacity="0.6" />

  <!-- Outer Ornate Beaded Rim -->
  <circle cx="400" cy="400" r="366" fill="none" stroke="url(#goldLight)" stroke-width="4.5" />
  <circle cx="400" cy="400" r="352" fill="none" stroke="url(#goldDark)" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" />
  <circle cx="400" cy="400" r="340" fill="none" stroke="url(#goldLight)" stroke-width="3" />

  <!-- Outer Beaded Dots Pattern -->
  <g fill="url(#goldLight)" opacity="0.85">
    <!-- Concentric Cardinal Accent Gems -->
    <circle cx="400" cy="34" r="5" />
    <circle cx="400" cy="766" r="5" />
    <circle cx="34" cy="400" r="5" />
    <circle cx="766" cy="400" r="5" />

    <!-- Corner Star Sparkles -->
    <g transform="translate(142, 142)">
      <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="#FFFBE6" filter="url(#glow)" />
      <circle cx="0" cy="0" r="3" fill="#FFF" />
    </g>
    <g transform="translate(658, 142)">
      <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="#FFFBE6" filter="url(#glow)" />
      <circle cx="0" cy="0" r="3" fill="#FFF" />
    </g>
    <g transform="translate(142, 658)">
      <path d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z" fill="#FFFBE6" filter="url(#glow)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFF" />
    </g>
    <g transform="translate(658, 658)">
      <path d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z" fill="#FFFBE6" filter="url(#glow)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFF" />
    </g>
  </g>

  <!-- Inner Concentric Frame -->
  <circle cx="400" cy="400" r="332" fill="none" stroke="#684e1b" stroke-width="1.5" />
  <circle cx="400" cy="400" r="324" fill="none" stroke="url(#goldLight)" stroke-width="1" stroke-dasharray="2 6" />

  <!-- Top Crown / Fleur-de-lis Finial -->
  <g transform="translate(400, 88)" fill="url(#goldLight)" filter="url(#dropShadow)">
    <path d="M0 -22 C6 -14 12 -4 0 14 C-12 -4 -6 -14 0 -22 Z" />
    <path d="M-4 2 C-14 -2 -22 8 -16 16 C-10 18 -4 10 -2 5 Z" />
    <path d="M4 2 C14 -2 22 8 16 16 C10 18 4 10 2 5 Z" />
    <rect x="-10" y="14" width="20" height="3.5" rx="1.5" fill="url(#goldDark)" />
    <circle cx="0" cy="-24" r="2.5" fill="#FFFBE6" />
  </g>

  <!-- ==================== CENTRAL CM MONOGRAM & FILIGREE ==================== -->
  
  <!-- Left Filigree Flourish -->
  <g fill="none" stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round" filter="url(#dropShadow)">
    <path d="M230 255 C215 220 230 180 265 170 C290 162 305 180 295 205 C285 228 260 230 248 215" />
    <path d="M220 280 C200 295 190 325 210 345 C230 360 255 350 255 330 C255 310 235 305 225 315" stroke-width="2" />
    <path d="M245 220 C225 240 215 270 230 295" stroke-width="3.5" />
    <!-- Leaflet accents -->
    <path d="M260 178 C250 168 240 175 246 185 C252 195 264 190 260 178 Z" fill="url(#goldLight)" />
    <path d="M205 315 C195 305 188 315 195 324 C202 332 212 325 205 315 Z" fill="url(#goldLight)" />
  </g>

  <!-- Right Filigree Flourish (Mirrored) -->
  <g fill="none" stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round" filter="url(#dropShadow)">
    <path d="M570 255 C585 220 570 180 535 170 C510 162 495 180 505 205 C515 228 540 230 552 215" />
    <path d="M580 280 C600 295 610 325 590 345 C570 360 545 350 545 330 C545 310 565 305 575 315" stroke-width="2" />
    <path d="M555 220 C575 240 585 270 570 295" stroke-width="3.5" />
    <!-- Leaflet accents -->
    <path d="M540 178 C550 168 560 175 554 185 C548 195 536 190 540 178 Z" fill="url(#goldLight)" />
    <path d="M595 315 C605 305 612 315 605 324 C598 332 588 325 595 315 Z" fill="url(#goldLight)" />
  </g>

  <!-- Grand Intertwined C and M Monogram -->
  <g filter="url(#dropShadow)">
    <!-- Letter 'C' in background/loop (Hollow Gold Serif) -->
    <path d="M370 185 C320 185 275 225 275 295 C275 365 320 405 375 405 C408 405 432 390 445 375 C450 368 442 360 435 365 C418 380 395 390 372 390 C330 390 295 355 295 295 C295 235 330 200 372 200 C398 200 420 212 432 225 C438 230 446 222 440 216 C425 198 400 185 370 185 Z" fill="url(#goldLight)" />
    <path d="M370 185 C320 185 275 225 275 295 C275 365 320 405 375 405 C408 405 432 390 445 375" stroke="#52390f" stroke-width="2" fill="none" />

    <!-- Letter 'M' in foreground (Solid Metallic Roman Serif) -->
    <!-- Left Stem -->
    <path d="M375 222 L388 222 L388 368 L375 368 L375 376 L422 376 L422 368 L409 368 L409 250 L460 376 L478 376 L528 250 L528 368 L515 368 L515 376 L560 376 L560 368 L548 368 L548 222 L532 222 L469 350 L406 222 Z" fill="url(#goldLight)" stroke="url(#goldDark)" stroke-width="2.5" />
    
    <!-- Shading accents on 'M' -->
    <path d="M409 250 L460 376 L454 376 L409 265 Z" fill="#6B4F12" opacity="0.6" />
    <path d="M528 250 L528 368 L524 368 L524 260 Z" fill="#6B4F12" opacity="0.6" />
  </g>

  <!-- ==================== HORIZONTAL DIVIDER & 8-BALL ==================== -->
  
  <!-- Left Divider Line & Diamond Accent -->
  <g stroke="url(#goldLight)" stroke-width="2.5">
    <line x1="120" y1="440" x2="350" y2="440" />
    <circle cx="120" cy="440" r="3.5" fill="url(#goldLight)" stroke="none" />
    <polygon points="350,440 357,434 364,440 357,446" fill="url(#goldLight)" stroke="none" />
  </g>

  <!-- Right Divider Line & Diamond Accent -->
  <g stroke="url(#goldLight)" stroke-width="2.5">
    <line x1="450" y1="440" x2="680" y2="440" />
    <circle cx="680" cy="440" r="3.5" fill="url(#goldLight)" stroke="none" />
    <polygon points="450,440 443,434 436,440 443,446" fill="url(#goldLight)" stroke="none" />
  </g>

  <!-- Center Billiards 8-Ball Badge -->
  <g transform="translate(400, 440)" filter="url(#dropShadow)">
    <!-- Outer Gold Bezel -->
    <circle cx="0" cy="0" r="28" fill="url(#goldDark)" stroke="url(#goldLight)" stroke-width="2" />
    <circle cx="0" cy="0" r="25" fill="#0A0A0E" stroke="#1F1F2A" stroke-width="1.5" />
    
    <!-- Ball Volume Gradient -->
    <circle cx="0" cy="0" r="24" fill="#0B0B0E" />
    <circle cx="-6" cy="-6" r="14" fill="url(#ballShine)" />

    <!-- Center White 8 Circle -->
    <circle cx="0" cy="0" r="11" fill="#F4F4F6" stroke="#D1D1DB" stroke-width="0.8" />
    
    <!-- Bold Number 8 -->
    <text x="0" y="4.5" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#0A0A0E">8</text>
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->

  <!-- "CASA MILANO" Main Wordmark -->
  <g filter="url(#dropShadow)">
    <text x="400" y="515" text-anchor="middle" font-family="'Outfit', 'Times New Roman', Georgia, serif" font-weight="800" font-size="48" letter-spacing="9" fill="url(#goldLight)">
      CASA MILANO
    </text>
    <!-- Secondary Bevel Edge -->
    <text x="400" y="515" text-anchor="middle" font-family="'Outfit', 'Times New Roman', Georgia, serif" font-weight="800" font-size="48" letter-spacing="9" fill="none" stroke="#684D16" stroke-width="1">
      CASA MILANO
    </text>
  </g>

  <!-- Subtitle: "- LUXURIOUS GAMING CAFE -" -->
  <g transform="translate(400, 552)" filter="url(#dropShadow)">
    <!-- Left Accent Line -->
    <line x1="-240" y1="-5" x2="-160" y2="-5" stroke="url(#goldLight)" stroke-width="1.5" />
    <circle cx="-240" cy="-5" r="2" fill="url(#goldLight)" />
    
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="600" font-size="16" letter-spacing="6" fill="#F4DE9C">
      LUXURIOUS GAMING CAFE
    </text>
    
    <!-- Right Accent Line -->
    <line x1="160" y1="-5" x2="240" y2="-5" stroke="url(#goldLight)" stroke-width="1.5" />
    <circle cx="240" cy="-5" r="2" fill="url(#goldLight)" />
  </g>

  <!-- ==================== BOTTOM TRIPTYCH ICONS ==================== -->
  
  <!-- Divider Arc below text -->
  <path d="M220 590 Q400 620 580 590" fill="none" stroke="url(#goldDark)" stroke-width="1.5" opacity="0.7" />

  <!-- 1. LEFT ICON: PS5 DualSense Controller -->
  <g transform="translate(230, 660)" filter="url(#dropShadow)">
    <!-- Outer Glow Silhouette -->
    <path d="M-45 -22 C-38 -32 -20 -36 0 -36 C20 -36 38 -32 45 -22 C52 -10 50 15 42 32 C38 40 28 42 22 34 L12 18 C8 14 -8 14 -12 18 L-22 34 C-28 42 -38 40 -42 32 C-50 15 -52 -10 -45 -22 Z" fill="#1C1E26" stroke="url(#goldLight)" stroke-width="2" />
    <!-- White Face Shell Plate -->
    <path d="M-40 -20 C-34 -28 -18 -32 0 -32 C18 -32 34 -28 40 -20 C46 -10 44 12 36 28 C34 32 26 34 22 28 L14 16 C8 10 -8 10 -14 16 L-22 28 C-26 34 -34 32 -36 28 C-44 12 -46 -10 -40 -20 Z" fill="#EDEDF2" stroke="#B0B2C0" stroke-width="1" />
    <!-- Center Touchpad & Cyan LED Bar -->
    <rect x="-16" y="-28" width="32" height="18" rx="2" fill="#1B1C22" />
    <rect x="-14" y="-29" width="28" height="2" rx="1" fill="#00E5FF" filter="url(#glow)" />
    <!-- Dual Analog Sticks -->
    <circle cx="-13" cy="8" r="8" fill="#121318" stroke="#3A3D4D" stroke-width="1.5" />
    <circle cx="-13" cy="8" r="4.5" fill="#252834" />
    <circle cx="13" cy="8" r="8" fill="#121318" stroke="#3A3D4D" stroke-width="1.5" />
    <circle cx="13" cy="8" r="4.5" fill="#252834" />
    <!-- D-Pad (Left) -->
    <g fill="#3A3D4D">
      <rect x="-29" y="-12" width="4" height="12" rx="1" />
      <rect x="-33" y="-8" width="12" height="4" rx="1" />
    </g>
    <!-- Action Buttons (Right) -->
    <g fill="#3A3D4D">
      <circle cx="27" cy="-14" r="2" />
      <circle cx="33" cy="-8" r="2" />
      <circle cx="21" cy="-8" r="2" />
      <circle cx="27" cy="-2" r="2" />
    </g>
  </g>

  <!-- 2. CENTER ICON: Triangle Rack of Snooker / Pool Balls -->
  <g transform="translate(400, 660)" filter="url(#dropShadow)">
    <!-- Wooden / Gold Rack Frame -->
    <polygon points="0,-42 46,36 -46,36" fill="none" stroke="url(#goldLight)" stroke-width="4.5" stroke-linejoin="round" />
    <polygon points="0,-42 46,36 -46,36" fill="#0D1018" stroke="url(#goldDark)" stroke-width="1.5" />
    
    <!-- Rack Balls (15-Ball Triangle) -->
    <!-- Row 1 (Apex) -->
    <circle cx="0" cy="-26" r="6.5" fill="#E6B800" stroke="#FFF" stroke-width="0.5" />
    <!-- Row 2 -->
    <circle cx="-6.5" cy="-14" r="6.5" fill="#D62828" />
    <circle cx="6.5" cy="-14" r="6.5" fill="#1D4ED8" />
    <!-- Row 3 -->
    <circle cx="-13" cy="-2" r="6.5" fill="#7C3AED" />
    <circle cx="0" cy="-2" r="6.5" fill="#111116" stroke="#444" stroke-width="0.8" />
    <circle cx="13" cy="-2" r="6.5" fill="#EA580C" />
    <!-- Row 4 -->
    <circle cx="-19.5" cy="10" r="6.5" fill="#059669" />
    <circle cx="-6.5" cy="10" r="6.5" fill="#991B1B" />
    <circle cx="6.5" cy="10" r="6.5" fill="#F59E0B" />
    <circle cx="19.5" cy="10" r="6.5" fill="#3B82F6" />
    <!-- Row 5 (Base) -->
    <circle cx="-26" cy="22" r="6.5" fill="#DC2626" />
    <circle cx="-13" cy="22" r="6.5" fill="#FBBF24" />
    <circle cx="0" cy="22" r="6.5" fill="#10B981" />
    <circle cx="13" cy="22" r="6.5" fill="#8B5CF6" />
    <circle cx="26" cy="22" r="6.5" fill="#C2410C" />
    <!-- Specular Highlight Sheen on Triangle -->
    <path d="M-30 28 L0 -34 L12 -34 L-20 28 Z" fill="#FFFFFF" opacity="0.12" />
  </g>

  <!-- 3. RIGHT ICON: Steaming Luxury Coffee Cup with CM Monogram -->
  <g transform="translate(570, 662)" filter="url(#dropShadow)">
    <!-- Rising Steam Swirls -->
    <path d="M-6 -22 C-10 -30 2 -36 -4 -44" fill="none" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <path d="M2 -20 C-2 -28 10 -34 4 -42" fill="none" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M10 -22 C6 -29 18 -35 12 -41" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Saucer Plate -->
    <ellipse cx="0" cy="16" rx="38" ry="8" fill="#12131A" stroke="url(#goldLight)" stroke-width="2.5" />
    <ellipse cx="0" cy="14" rx="28" ry="4" fill="#0B0C10" stroke="url(#goldDark)" stroke-width="1" />

    <!-- Cup Body -->
    <path d="M-22 -14 L22 -14 C20 8 15 14 0 14 C-15 14 -20 8 -22 -14 Z" fill="#171822" stroke="url(#goldLight)" stroke-width="2.5" />
    <!-- Cup Rim & Steaming Espresso -->
    <ellipse cx="0" cy="-14" rx="22" ry="5.5" fill="#2E1B0E" stroke="url(#goldLight)" stroke-width="2" />
    <ellipse cx="0" cy="-14" rx="18" ry="3.5" fill="#4A2E19" />
    
    <!-- Cup Handle -->
    <path d="M20 -10 C32 -10 32 8 18 10" fill="none" stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round" />

    <!-- Mini CM Gold Monogram on Cup Front -->
    <text x="0" y="5" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="11" fill="url(#goldLight)" letter-spacing="1">CM</text>
  </g>

  <!-- Bottom Accent Finial -->
  <g transform="translate(400, 742)" fill="url(#goldLight)">
    <polygon points="0,0 -8,-8 0,-14 8,-8" />
    <circle cx="0" cy="4" r="2" />
  </g>

</svg>
